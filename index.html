<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Монитор Света PRO</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2987/2987996.png">
    
    <style>
        body { background: #0a0a0a; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
        .card { background: #111; border: 2px solid #333; padding: 25px; border-radius: 25px; width: 100%; max-width: 380px; box-shadow: 0 15px 50px rgba(0,0,0,0.9); position: relative; }
        
        #main-status { padding: 12px; border-radius: 12px; font-weight: bold; font-size: 1.3rem; margin-bottom: 15px; text-transform: uppercase; border: 2px solid transparent; }
        .status-on { background: rgba(0, 255, 136, 0.1); color: #00ff88; border-color: #00ff88; }
        .status-off { background: rgba(255, 68, 68, 0.1); color: #ff4444; border-color: #ff4444; }

        .timeline-container { position: relative; height: 25px; background: #222; border-radius: 8px; margin: 10px 0 25px 0; overflow: hidden; border: 1px solid #333; }
        .timeline-segment { position: absolute; height: 100%; top: 0; }
        #now-marker { position: absolute; width: 3px; height: 100%; background: #fff; top: 0; z-index: 10; box-shadow: 0 0 10px #fff; }

        .timer-block { margin: 10px 0; padding: 10px; border-radius: 12px; background: #181818; border: 1px solid #222; display: none; }
        .digits { font-size: 2.5rem; font-family: monospace; display: block; font-weight: bold; }
        .label { font-size: 0.7rem; text-transform: uppercase; opacity: 0.5; display: block; }

        /* Плашка Уведомлений */
        #alert-box { margin-top: 15px; padding: 12px; background: #1a1a1a; border-radius: 15px; border: 1px solid #333; display: flex; align-items: center; gap: 12px; text-align: left; transition: 0.3s; }
        .alert-icon { font-size: 1.2rem; }
        .alert-text { font-size: 0.85rem; line-height: 1.2; }
        .alert-urgent { border-color: #ff9500; background: rgba(255, 149, 0, 0.1); color: #ff9500; animation: blink 1.5s infinite; }

        @keyframes blink { 50% { opacity: 0.7; } }

        #schedule-list { margin-top: 15px; padding: 10px; background: rgba(255,255,255,0.03); border-radius: 12px; border: 1px solid #222; text-align: left; }
        .sch-title { font-size: 0.65rem; color: #666; text-transform: uppercase; margin-bottom: 8px; display: block; letter-spacing: 1px; }
        .sch-item { display: inline-block; background: #222; color: #ff4444; padding: 4px 8px; border-radius: 6px; font-size: 0.85rem; margin: 2px; font-family: monospace; border: 1px solid #333; }

        .stats-section { background: #1a1a1a; border-radius: 15px; padding: 10px; margin-top: 20px; text-align: left; border: 1px solid #333; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .stat-item { font-size: 0.75rem; color: #888; }
        .stat-value { display: block; font-size: 1rem; color: #00ff88; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <div id="main-status">Загрузка...</div>
    <div class="timeline-container" id="timeline"><div id="now-marker"></div></div>

    <div id="block-off" class="timer-block" style="color: #00ff88;">
        <span class="label">Свет будет еще:</span>
        <span id="t-off" class="digits">00:00:00</span>
    </div>

    <div id="block-on" class="timer-block" style="color: #ff4444;">
        <span class="label">До включения осталось:</span>
        <span id="t-on" class="digits">00:00:00</span>
    </div>

    <div id="alert-box">
        <div class="alert-icon">🔔</div>
        <div class="alert-text" id="alert-msg">Анализ графика...</div>
    </div>

    <div id="schedule-list">
        <span class="sch-title">График отключений:</span>
        <div id="list-content"></div>
    </div>

    <div class="stats-section">
        <div class="stat-item">Свет/сутки:<span id="stat-total" class="stat-value">--</span></div>
        <div class="stat-item">Макс. окно:<span id="stat-max" class="stat-value">--</span></div>
        <div class="stat-item">Прогресс:<span id="stat-used" class="stat-value">--</span></div>
        <div class="stat-item">Осталось окон:<span id="stat-count" class="stat-value">--</span></div>
    </div>
</div>

<script>
    const USER = "zazasa223123"; 
    const REPO = "zazasa";  
    const FILE = "data.txt";     

    let schedule = [];
    let isRunning = false;

    async function loadData() {
        try {
            const url = `https://raw.githubusercontent.com/${USER}/${REPO}/main/${FILE}?t=${Date.now()}`;
            const response = await fetch(url);
            const text = await response.text();
            if (text) { init(text); }
        } catch (e) {
            document.getElementById('main-status').innerText = "Ошибка сети";
        }
    }

    function init(val) {
        parse(val);
        drawTimeline();
        renderScheduleList(val);
        isRunning = true;
        update(); 
    }

    function parse(str) {
        schedule = [];
        const matches = str.matchAll(/(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})/g);
        for (const m of matches) {
            schedule.push({ start: toM(m[1]), end: toM(m[2] === "00:00" ? "24:00" : m[2]) });
        }
        schedule.sort((a,b) => a.start - b.start);
    }

    function renderScheduleList(val) {
        const container = document.getElementById('list-content');
        container.innerHTML = '';
        val.split(',').forEach(p => {
            if(p.trim()) {
                const span = document.createElement('span');
                span.className = 'sch-item';
                span.innerText = p.trim();
                container.appendChild(span);
            }
        });
    }

    function toM(t) { const [h, m] = t.split(':').map(Number); return h * 60 + m; }

    function drawTimeline() {
        const tl = document.getElementById('timeline');
        tl.querySelectorAll('.timeline-segment').forEach(s => s.remove());
        schedule.forEach(range => {
            const div = document.createElement('div');
            div.className = 'timeline-segment';
            div.style.cssText = `background:#ff4444; left:${range.start/14.4}%; width:${(range.end-range.start)/14.4}%;`;
            tl.appendChild(div);
        });
        tl.style.background = '#008844'; 
    }

    function update() {
        const now = new Date();
        const cur = now.getHours() * 60 + now.getMinutes();
        const sec = now.getSeconds();
        document.getElementById('now-marker').style.left = (cur / 14.4) + '%';

        if (!isRunning || schedule.length === 0) return;
        let currentOff = schedule.find(r => cur >= r.start && cur < r.end);
        let bOn = document.getElementById('block-on'), bOff = document.getElementById('block-off');
        let diff = 0;
        let alertMsg = "";

        if (currentOff) {
            bOn.style.display = 'block'; bOff.style.display = 'none';
            diff = currentOff.end - cur;
            document.getElementById('t-on').innerText = fmt(diff, sec);
            statusUI("🌑 СВЕТА НЕТ", "status-off");
            alertMsg = `Включат через ${diff} мин.`;
        } else {
            bOn.style.display = 'none'; bOff.style.display = 'block';
            let nextOff = schedule.find(r => r.start > cur);
            diff = nextOff ? (nextOff.start - cur) : (schedule[0].start + 1440 - cur);
            document.getElementById('t-off').innerText = fmt(diff, sec);
            statusUI("⚡ СВЕТ ЕСТЬ", "status-on");
            alertMsg = `Отключат через ${diff} мин.`;
        }

        // Логика плашки уведомлений
        const alertBox = document.getElementById('alert-box');
        document.getElementById('alert-msg').innerText = alertMsg;
        if (diff <= 15) {
            alertBox.classList.add('alert-urgent');
        } else {
            alertBox.classList.remove('alert-urgent');
        }

        if (sec === 0 || document.getElementById('stat-total').innerText === "--") updateStats(cur);
    }

    function updateStats(cur) {
        let offMin = 0; schedule.forEach(r => offMin += (r.end - r.start));
        let lightWindows = [];
        let lastEnd = 0;
        schedule.forEach(r => {
            if (r.start > lastEnd) lightWindows.push(r.start - lastEnd);
            lastEnd = r.end;
        });
        if (lastEnd < 1440) lightWindows.push(1440 - lastEnd);
        
        const maxWin = Math.max(...lightWindows, 0);
        document.getElementById('stat-total').innerText = Math.floor((1440-offMin)/60) + "ч " + (1440-offMin)%60 + "м";
        document.getElementById('stat-max').innerText = Math.floor(maxWin/60) + "ч " + (maxWin%60) + "м";
        document.getElementById('stat-count').innerText = lightWindows.length;
        document.getElementById('stat-used').innerText = Math.round(cur/14.4) + "%";
    }

    function statusUI(txt, cls) { const s = document.getElementById('main-status'); s.innerText = txt; s.className = cls; }
    function fmt(m, s) { return `${Math.floor(m/60).toString().padStart(2,'0')}:${(m%60).toString().padStart(2,'0')}:${(59-s).toString().padStart(2,'0')}`; }

    loadData();
    setInterval(loadData, 300000); 
    setInterval(update, 1000);
</script>
</body>
</html>

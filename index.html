
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Монитор Света PRO</title>
    
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2987/2987996.png">

    <meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="display" content="standalone">

<link rel="manifest" href="manifest.json">
    <style>
        body { background: #0a0a0a; color: #fff; font-family: 'Segoe UI', sans-serif; text-align: center; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; overflow: hidden; }
        .card { background: #111; border: 2px solid #333; padding: 25px; border-radius: 25px; width: 100%; max-width: 380px; box-shadow: 0 15px 50px rgba(0,0,0,0.9); position: relative; z-index: 1; }
        
        /* Меню */
        .menu-btn { position: absolute; top: 20px; left: 20px; cursor: pointer; z-index: 10; padding: 5px; }
        .menu-icon { width: 25px; height: 3px; background: #888; margin: 4px 0; border-radius: 2px; transition: 0.3s; }
        .side-menu { position: fixed; top: 0; left: -280px; width: 250px; height: 100%; background: #151515; border-right: 1px solid #333; transition: 0.4s; z-index: 100; padding: 60px 20px; text-align: left; }
        .side-menu.active { left: 0; }
        .menu-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: none; z-index: 90; }
        .menu-overlay.active { display: block; }

        h3 { font-size: 1rem; color: #00ff88; margin-bottom: 20px; text-transform: uppercase; }
        .settings-label { display: block; font-size: 0.75rem; color: #888; margin-bottom: 10px; }
        .alarm-input { width: 100%; background: #222; border: 1px solid #444; color: #fff; padding: 10px; border-radius: 8px; outline: none; }

        /* Интерфейс */
        #main-status { padding: 12px; border-radius: 12px; font-weight: bold; font-size: 1.3rem; margin-bottom: 15px; text-transform: uppercase; border: 2px solid transparent; }
        .status-on { background: rgba(0, 255, 136, 0.1); color: #00ff88; border-color: #00ff88; }
        .status-off { background: rgba(255, 68, 68, 0.1); color: #ff4444; border-color: #ff4444; }

        .timeline-container { position: relative; height: 25px; background: #222; border-radius: 8px; margin: 10px 0 25px 0; overflow: hidden; border: 1px solid #333; }
        .timeline-segment { position: absolute; height: 100%; top: 0; }
        #now-marker { position: absolute; width: 3px; height: 100%; background: #fff; top: 0; z-index: 10; box-shadow: 0 0 10px #fff; }

        .timer-block { margin: 10px 0; padding: 10px; border-radius: 12px; background: #181818; border: 1px solid #222; display: none; }
        .digits { font-size: 2.5rem; font-family: monospace; display: block; font-weight: bold; }
        .label { font-size: 0.7rem; text-transform: uppercase; opacity: 0.5; display: block; }

        #alert-box { margin-top: 15px; padding: 12px; background: #1a1a1a; border-radius: 15px; border: 1px solid #333; display: flex; align-items: center; gap: 12px; text-align: left; }
        .alert-urgent { border-color: #ff9500; background: rgba(255, 149, 0, 0.1); color: #ff9500; animation: blink 1.5s infinite; }
        @keyframes blink { 50% { opacity: 0.7; } }

        #schedule-list { margin-top: 15px; padding: 10px; background: rgba(255,255,255,0.03); border-radius: 12px; border: 1px solid #222; text-align: left; }
        .sch-title { font-size: 0.65rem; color: #666; text-transform: uppercase; margin-bottom: 8px; display: block; }
        .sch-item { display: inline-block; background: #222; color: #ff4444; padding: 4px 8px; border-radius: 6px; font-size: 0.85rem; margin: 2px; font-family: monospace; border: 1px solid #333; }

        .stats-section { background: #1a1a1a; border-radius: 15px; padding: 10px; margin-top: 20px; text-align: left; border: 1px solid #333; display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .stat-item { font-size: 0.75rem; color: #888; }
        .stat-value { display: block; font-size: 1rem; color: #00ff88; font-weight: bold; }
        #sync-label { grid-column: span 2; font-size: 0.6rem; color: #444; text-align: center; margin-top: 5px; text-transform: uppercase; }
    </style>
</head>
<body>

    <div class="menu-btn" onclick="toggleMenu()">
        <div class="menu-icon"></div><div class="menu-icon"></div><div class="menu-icon"></div>
    </div>
    <div class="menu-overlay" id="overlay" onclick="toggleMenu()"></div>
    <div class="side-menu" id="sideMenu">
        <h3>Настройки</h3>
        <span class="settings-label">Уведомление (мин до события):</span>
        <input type="number" id="alarmTime" class="alarm-input" value="15" onchange="saveSettings()">
    </div>

    <div class="card">
        <div id="main-status">Загрузка...</div>
        <div class="timeline-container" id="timeline"><div id="now-marker"></div></div>

        <div id="block-off" class="timer-block" style="color: #00ff88;"><span class="label">Свет будет еще:</span><span id="t-off" class="digits">00:00:00</span></div>
        <div id="block-on" class="timer-block" style="color: #ff4444;"><span class="label">До включения:</span><span id="t-on" class="digits">00:00:00</span></div>

        <div id="alert-box"><div class="alert-icon">🔔</div><div id="alert-msg" style="font-size: 0.85rem;">Поиск данных...</div></div>

        <div id="schedule-list"><span class="sch-title">График отключений:</span><div id="list-content"></div></div>

        <div class="stats-section">
            <div class="stat-item">Свет/сутки:<span id="stat-total" class="stat-value">--</span></div>
            <div class="stat-item">Макс. окно:<span id="stat-max" class="stat-value">--</span></div>
            <div class="stat-item">Прогресс:<span id="stat-used" class="stat-value">--</span></div>
            <div class="stat-item">Окон:<span id="stat-count" class="stat-value">--</span></div>
            <div id="sync-label">Синхронизация...</div>
        </div>
    </div>

<script>
    const USER = "zazasa223123"; 
    const REPO = "zazasa";  
    const FILE = "data.txt";     

    let schedule = [];
    let isRunning = false;
    let userAlarmMinutes = localStorage.getItem('alarmMins') || 15;

    function toggleMenu() { document.getElementById('sideMenu').classList.toggle('active'); document.getElementById('overlay').classList.toggle('active'); }
    function saveSettings() { userAlarmMinutes = document.getElementById('alarmTime').value; localStorage.setItem('alarmMins', userAlarmMinutes); }

    async function loadData() {
        const syncLabel = document.getElementById('sync-label');
        try {
            const url = `https://raw.githubusercontent.com/${USER}/${REPO}/main/${FILE}?t=${Date.now()}`;
            const response = await fetch(url);
            if (!response.ok) throw new Error("Offline");
            
            const text = await response.text();
            localStorage.setItem('cached_schedule', text);
            syncLabel.innerText = "Обновлено только что";
            init(text);
        } catch (e) {
            const cachedText = localStorage.getItem('cached_schedule');
            if (cachedText) {
                syncLabel.innerText = "Оффлайн режим (кэш)";
                init(cachedText);
            } else {
                document.getElementById('main-status').innerText = "Нужен интернет";
            }
        }
    }

    function init(val) {
        parse(val);
        drawTimeline();
        renderScheduleList(val);
        document.getElementById('alarmTime').value = userAlarmMinutes;
        isRunning = true;
        update(); 
    }

    function parse(str) {
        schedule = [];
        const matches = str.matchAll(/(\d{1,2}:\d{2})\s*-\s*(\d{1,2}:\d{2})/g);
        for (const m of matches) {
            schedule.push({ start: toM(m[1]), end: toM(m[2] === "00:00" ? "24:00" : m[2]) });
        }
        schedule.sort((a,b) => a.start - b.start);
    }

    function renderScheduleList(val) {
        const container = document.getElementById('list-content');
        container.innerHTML = '';
        val.split(',').forEach(p => {
            if(p.trim()) {
                const span = document.createElement('span');
                span.className = 'sch-item';
                span.innerText = p.trim();
                container.appendChild(span);
            }
        });
    }

    function toM(t) { const [h, m] = t.split(':').map(Number); return h * 60 + m; }

    function drawTimeline() {
        const tl = document.getElementById('timeline');
        tl.querySelectorAll('.timeline-segment').forEach(s => s.remove());
        schedule.forEach(range => {
            const div = document.createElement('div');
            div.className = 'timeline-segment';
            div.style.cssText = `background:#ff4444; left:${range.start/14.4}%; width:${(range.end-range.start)/14.4}%;`;
            tl.appendChild(div);
        });
        tl.style.background = '#008844'; 
    }

    function update() {
        const now = new Date();
        const cur = now.getHours() * 60 + now.getMinutes();
        const sec = now.getSeconds();
        document.getElementById('now-marker').style.left = (cur / 14.4) + '%';

        if (!isRunning || schedule.length === 0) return;
        let currentOff = schedule.find(r => cur >= r.start && cur < r.end);
        let bOn = document.getElementById('block-on'), bOff = document.getElementById('block-off');
        let diff = 0; let act = "";

        if (currentOff) {
            bOn.style.display = 'block'; bOff.style.display = 'none';
            diff = currentOff.end - cur;
            document.getElementById('t-on').innerText = fmt(diff, sec);
            statusUI("🌑 СВЕТА НЕТ", "status-off");
            act = "Включат через";
        } else {
            bOn.style.display = 'none'; bOff.style.display = 'block';
            let nextOff = schedule.find(r => r.start > cur);
            diff = nextOff ? (nextOff.start - cur) : (schedule[0].start + 1440 - cur);
            document.getElementById('t-off').innerText = fmt(diff, sec);
            statusUI("⚡ СВЕТ ЕСТЬ", "status-on");
            act = "Отключат через";
        }

        document.getElementById('alert-msg').innerText = `${act} ${diff} мин.`;
        const ab = document.getElementById('alert-box');
        if (diff <= userAlarmMinutes) ab.classList.add('alert-urgent'); else ab.classList.remove('alert-urgent');

        if (sec === 0 || document.getElementById('stat-total').innerText === "--") updateStats(cur);
    }

    function updateStats(cur) {
        let offMin = 0; schedule.forEach(r => offMin += (r.end - r.start));
        let lightWin = []; let last = 0;
        schedule.forEach(r => { if (r.start > last) lightWin.push(r.start - last); last = r.end; });
        if (last < 1440) lightWin.push(1440 - last);
        const max = Math.max(...lightWin, 0);
        document.getElementById('stat-total').innerText = Math.floor((1440-offMin)/60) + "ч " + (1440-offMin)%60 + "м";
        document.getElementById('stat-max').innerText = Math.floor(max/60) + "ч " + (max%60) + "м";
        document.getElementById('stat-count').innerText = lightWin.length;
        document.getElementById('stat-used').innerText = Math.round(cur/14.4) + "%";
    }

    function statusUI(t, c) { const s = document.getElementById('main-status'); s.innerText = t; s.className = c; }
    function fmt(m, s) { return `${Math.floor(m/60).toString().padStart(2,'0')}:${(m%60).toString().padStart(2,'0')}:${(59-s).toString().padStart(2,'0')}`; }

    loadData();
    setInterval(loadData, 300000); 
    setInterval(update, 1000);
</script>
</body>
</html>
